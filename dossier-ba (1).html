/* Concept: a structural engineer's drawing office. Pale drafting paper, ink lines, rebar drawn in red, one teal accent for everything you can act on. */
:root{
  --bg:#E9EDEF; --canvas:#FAFBFA; --surface:#FFFFFF; --ink:#17242D; --ink-2:#566873; --line:#CBD4D9;
  --accent:#0B7A69; --accent-soft:#D6EFE9; --accent-ink:#FFFFFF; --danger:#B4381A;
  --d-canvas:var(--canvas); --d-ink:var(--ink); --d-ink2:var(--ink-2);
  --d-slab:#EEF3F5; --d-beam:#D6EFE9; --d-axis:#C0544A; --d-wall:#E7ECEE; --d-concrete:#DDE3E6;
  --d-glass:#CFE6EE; --d-door:#D8C3A5; --d-danger:#B4381A; --d-steel:#B4381A; --d-steel2:#1F5FA8;
  --font-ui:"IBM Plex Sans Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

    --accent:#3CC3AA; --accent-soft:#12372F; --accent-ink:#06211C; --danger:#F08A6C;
    --d-slab:#18242B; --d-beam:#12372F; --d-axis:#E08A7E; --d-wall:#1F2C34; --d-concrete:#2A3942;

    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1519; --canvas:#131C22; --surface:#1A252C; --ink:#E6EEF2; --ink-2:#93A5B0; --line:#2D3B44;
  --accent:#3CC3AA; --accent-soft:#12372F; --accent-ink:#06211C; --danger:#F08A6C;

<script>
/* Lecture DWG / DXF pour Bâtir Sûr : normalisation, explosion des blocs, dessin SVG, relevé */
(function (root) {
  const RAD = Math.PI / 180;
  const groupOf = l => String(l || '0').replace(/_Stylo_No__\d+$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim() || '0';
  const ROLES = {
    mext: 'Murs extérieurs', mint: 'Cloisons / refends', pot: 'Poteaux', pout: 'Poutres / longrines', sem: 'Fondations',
    fen: 'Fenêtres', porte: 'Portes', cot: 'Cotation', txt: 'Textes', mob: 'Mobilier / équipement', axe: 'Axes', ign: 'Ignorer', autre: 'Autre'
  };
  function guessRole(g) {
    const s = g.toLowerCase();
    if (/p[ée]riph|ext[ée]r|façade|facade|mur ext/.test(s) && /mur/.test(s)) return 'mext';
    if (/refend|cloison|int[ée]r|mur/.test(s)) return 'mint';
    if (/poteau|\bpot\b|column|colonne/.test(s)) return 'pot';
    if (/pout|longr|chain|beam/.test(s)) return 'pout';
    if (/semel|fond|footing/.test(s)) return 'sem';
    if (/fen[eê]tre|window|vitr/.test(s)) return 'fen';
    if (/porte|door/.test(s)) return 'porte';
    if (/cot|dim/.test(s)) return 'cot';
    if (/axe|axis|grid/.test(s)) return 'axe';
    if (/texte|text|anot|annot/.test(s)) return 'txt';
    if (/mobil|equip|fourniture|sanit/.test(s)) return 'mob';
    if (/cartouche|defpoints|terrain|topo|dessins plac/.test(s)) return 'ign';
    return 'autre';
  }
  // matrices affines [a,b,c,d,e,f] : x' = a x + c y + e ; y' = b x + d y + f
  const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  const ap = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  const ID = [1, 0, 0, 1, 0, 0];
  const scaleOf = m => Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1;
  const rotOf = m => Math.atan2(m[1], m[0]);
  function cleanText(s) {
    return String(s == null ? '' : s).replace(/\\P/g, ' ').replace(/\\[A-Za-z][^;\\{}]*;/g, '').replace(/[{}]/g, '').replace(/%%[uUoOdDcCpP]/g, m => ({ '%%d': '°', '%%c': 'Ø', '%%p': '±' }[m.toLowerCase()] || '')).replace(/\s+/g, ' ').trim();
  }
  /* ---------- normalisation : libredwg-web (DWG) ---------- */
  function fromLibredwg(db) {
    const blocks = {};
    (db.tables && db.tables.BLOCK_RECORD && db.tables.BLOCK_RECORD.entries || []).forEach(b => { blocks[b.name] = { base: b.basePoint || { x: 0, y: 0 }, ents: (b.entities || []).map(convLD).filter(Boolean) }; });
    const ms = (db.entities || []).map(convLD).filter(Boolean);
    return { blocks, ms, units: db.header && db.header.INSUNITS };
  }
  function convLD(e) {
    const L = e.layer, p = q => [q.x, q.y];
    switch (e.type) {
      case 'LINE': return { t: 'L', L, a: p(e.startPoint), b: p(e.endPoint) };
      case 'LWPOLYLINE': case 'POLYLINE2D': case 'POLYLINE': return { t: 'P', L, pts: (e.vertices || []).map(v => [v.x, v.y, v.bulge || 0]), closed: !!((e.flag || e.flags || 0) & 1) || !!e.closed };
      case 'CIRCLE': return { t: 'C', L, c: p(e.center), r: e.radius };
      case 'ARC': return { t: 'A', L, c: p(e.center), r: e.radius, a0: e.startAngle, a1: e.endAngle };
      case 'ELLIPSE': return { t: 'E', L, c: p(e.center), M: p(e.majorAxisEndPoint), k: e.axisRatio, a0: e.startAngle, a1: e.endAngle };
      case 'TEXT': return { t: 'T', L, p: p(e.startPoint), h: e.textHeight, rot: e.rotation || 0, s: cleanText(e.text) };
      case 'MTEXT': return { t: 'T', L, p: p(e.insertionPoint), h: e.textHeight, rot: e.rotation || (e.direction ? Math.atan2(e.direction.y, e.direction.x) : 0), s: cleanText(e.text) };
      case 'HATCH': return { t: 'H', L, polys: (e.boundaryPaths || []).filter(b => b.vertices && b.vertices.length > 2).map(b => b.vertices.map(v => [v.x, v.y])) };
      case 'INSERT': return { t: 'I', L, name: e.name, p: p(e.insertionPoint), sx: e.xScale || 1, sy: e.yScale || 1, rot: e.rotation || 0, attrs: (e.attribs || []).map(a => a.text && cleanText(a.text.text)).filter(Boolean) };
      case 'DIMENSION': return { t: 'D', L, name: e.name, m: e.measurement, txt: cleanText(e.text), p: e.textPoint ? p(e.textPoint) : null };
      case 'SOLID': case 'TRACE': return e.corner1 ? { t: 'H', L, polys: [[e.corner1, e.corner2, e.corner4 || e.corner3, e.corner3].filter(Boolean).map(p)] } : null;
      default: return null;
    }
  }
  /* ---------- normalisation : dxf-parser (DXF) ---------- */
  function fromDxfParser(d) {
    const blocks = {};
    Object.entries(d.blocks || {}).forEach(([n, b]) => { blocks[n] = { base: b.position || { x: 0, y: 0 }, ents: (b.entities || []).map(convDP).filter(Boolean) }; });
    return { blocks, ms: (d.entities || []).map(convDP).filter(Boolean), units: d.header && d.header.$INSUNITS };
  }
  function convDP(e) {
    const L = e.layer, p = q => [q.x, q.y];
    switch (e.type) {
      case 'LINE': return e.vertices && e.vertices.length > 1 ? { t: 'L', L, a: p(e.vertices[0]), b: p(e.vertices[1]) } : null;
      case 'LWPOLYLINE': case 'POLYLINE': return { t: 'P', L, pts: (e.vertices || []).map(v => [v.x, v.y, v.bulge || 0]), closed: !!e.shape || !!e.closed };
      case 'CIRCLE': return { t: 'C', L, c: p(e.center), r: e.radius };
      case 'ARC': return { t: 'A', L, c: p(e.center), r: e.radius, a0: e.startAngle, a1: e.endAngle };
      case 'ELLIPSE': return { t: 'E', L, c: p(e.center), M: p(e.majorAxisEndPoint), k: e.axisRatio, a0: e.startAngle, a1: e.endAngle };
      case 'TEXT': return { t: 'T', L, p: p(e.startPoint || e.position || { x: 0, y: 0 }), h: e.textHeight, rot: (e.rotation || 0) * RAD, s: cleanText(e.text) };
      case 'MTEXT': return { t: 'T', L, p: p(e.position || { x: 0, y: 0 }), h: e.height, rot: (e.rotation || 0) * RAD, s: cleanText(e.text) };
      case 'INSERT': return { t: 'I', L, name: e.name, p: p(e.position || { x: 0, y: 0 }), sx: e.xScale || 1, sy: e.yScale || 1, rot: (e.rotation || 0) * RAD, attrs: [] };
      case 'DIMENSION': return { t: 'D', L, name: e.block, m: e.actualMeasurement, txt: cleanText(e.text), p: e.middleOfText ? p(e.middleOfText) : null };
      case 'SOLID': return e.points ? { t: 'H', L, polys: [e.points.map(p)] } : null;
      default: return null;
    }
  }
  /* ---------- explosion des blocs ---------- */
  function explode(N, list, m, depth, out, layerOverride) {
    for (const e of list) {
      const L = (e.L === '0' && layerOverride) ? layerOverride : e.L;
      if (e.t === 'I') {
        const B = N.blocks[e.name]; if (!B || depth > 8 || /^\*(D|E)\d/.test(e.name) && depth > 6) continue;
        const c = Math.cos(e.rot), s = Math.sin(e.rot);
        const local = [c * e.sx, s * e.sx, -s * e.sy, c * e.sy, e.p[0], e.p[1]];
        const mm = mul(m, mul(local, [1, 0, 0, 1, -B.base.x, -B.base.y]));
        explode(N, B.ents, mm, depth + 1, out, L);
        continue;
      }
      if (e.t === 'D') { if (e.name && N.blocks[e.name]) explode(N, N.blocks[e.name].ents, m, depth + 1, out, L); out.push({ t: 'D', L, m: e.m, txt: e.txt, p: e.p && ap(m, e.p[0], e.p[1]) }); continue; }
      const k = scaleOf(m);
      if (e.t === 'L') out.push({ t: 'L', L, a: ap(m, ...e.a), b: ap(m, ...e.b) });
      else if (e.t === 'P') out.push({ t: 'P', L, closed: e.closed, pts: e.pts.map(q => ap(m, q[0], q[1]).concat(q[2] || 0)) });
      else if (e.t === 'C') out.push({ t: 'C', L, c: ap(m, ...e.c), r: e.r * k });
      else if (e.t === 'A') { const r = rotOf(m); out.push({ t: 'A', L, c: ap(m, ...e.c), r: e.r * k, a0: e.a0 + r, a1: e.a1 + r }); }
      else if (e.t === 'E') { const c0 = ap(m, ...e.c), tip = ap(m, e.c[0] + e.M[0], e.c[1] + e.M[1]); out.push({ t: 'E', L, c: c0, M: [tip[0] - c0[0], tip[1] - c0[1]], k: e.k, a0: e.a0, a1: e.a1 }); }
      else if (e.t === 'T') out.push({ t: 'T', L, p: ap(m, ...e.p), h: (e.h || 0.2) * k, rot: e.rot + rotOf(m), s: e.s });
      else if (e.t === 'H') out.push({ t: 'H', L, polys: e.polys.map(pl => pl.map(q => ap(m, q[0], q[1]))) });
    }
    return out;
  }
  /* vues : chaque bloc inséré au premier niveau = une vue ; le reste = la feuille */
  function views(N) {
    const vs = [], rest = [];
    N.ms.forEach(e => {
      if (e.t === 'I' && N.blocks[e.name] && !/^\*/.test(e.name) && N.blocks[e.name].ents.length > 30) {
        vs.push({ name: e.name, ents: explode(N, [e], ID, 0, []) });
      } else rest.push(e);

    o+=rect(p.x0,p.y0,p.dx,p.dy,'slab');

    o+=txt(cx,cy-fs*0.7,R.dLab[k][pi],fs*1.15,'tl strong')+txt(cx,cy+fs*0.7,'e = '+fl.e+' cm',fs*0.9,'tl');
  });
  R.xs.forEach(function(x){o+=line(x,-m*0.7,x,R.Ly+m*0.7,'ax');});
  R.ys.forEach(function(y){o+=line(-m*0.7,y,R.Lx+m*0.7,y,'ax');});
  var bw=sec.bb/100;
  R.bg.forEach(function(g,gi){
    var lab=R.beamLab[k][gi];
    if(g.dir==='x'){
      o+=rect(g.x1,g.y1-bw/2,g.L,bw,'beam');
      o+=txt(g.x1+g.L/2,g.y1-bw/2-fs*0.75,lab,fs*0.95,'tl');
    }else{
      o+=rect(g.x1-bw/2,g.y1,bw,g.L,'beam');
      o+=txt(g.x1-bw/2-fs*0.75,g.y1+g.L/2,lab,fs*0.95,'tl','middle',-90);
    }
  });
  var ca=fl.ca/100,cb=fl.cb/100;
  R.cols.forEach(function(c){
    o+=rect(c.x-ca/2,c.y-cb/2,ca,cb,'colm');
    o+=txt(c.x+ca/2+fs*0.25,c.y-cb/2-fs*0.55,c.id,fs*0.95,'tl strong','start');
  });
  R.xs.forEach(function(x,i2){o+=bubble(x,-m*0.88,String(i2+1),fs);o+=bubble(x,R.Ly+m*0.88,String(i2+1),fs);});
  R.ys.forEach(function(y,j2){o+=bubble(-m*0.88,y,letter(j2),fs);o+=bubble(R.Lx+m*0.88,y,letter(j2),fs);});
  for(i=0;i<R.nx-1;i++)o+=dimH(R.xs[i],R.xs[i+1],-m*0.38,F(R.xs[i+1]-R.xs[i],2),fs*0.9);
  for(j=0;j<R.ny-1;j++)o+=dimV(R.ys[j],R.ys[j+1],-m*0.38,F(R.ys[j+1]-R.ys[j],2),fs*0.9);
  o+=dimH(0,R.Lx,R.Ly+m*0.38,F(R.Lx,2),fs*0.9);
  o+=dimV(0,R.Ly,R.Lx+m*0.45,F(R.Ly,2),fs*0.9,true);
  return svg(-m,-m,W,H,o,Math.round(Math.min(760,Math.max(480,W*46))),'Plan de coffrage '+fl.name);
}

/* ---------- plan des fondations ---------- */
function fondations(P,R){
  var m=1.5,W=R.Lx+2*m,H=R.Ly+2*m,fs=Math.max(0.17,W/46),o='',i,j,lb=P.longB/100;
  R.cols.forEach(function(c,ci){
    var gr=R.footOf[ci];if(!gr)return;
    var A=gr.res.geo.A,B=gr.res.geo.B;
    o+=rect(c.x-A/2,c.y-B/2,A,B,'foot');
  });
  R.xs.forEach(function(x){o+=line(x,-m*0.7,x,R.Ly+m*0.7,'ax');});
  R.ys.forEach(function(y){o+=line(-m*0.7,y,R.Lx+m*0.7,y,'ax');});
  R.bg.forEach(function(g,gi){
    var lab=R.lgLab[gi];if(!lab)return;
    if(g.dir==='x'){o+=rect(g.x1,g.y1-lb/2,g.L,lb,'beam');o+=txt(g.x1+g.L/2,g.y1-lb/2-fs*0.75,lab,fs*0.95,'tl');}
    else{o+=rect(g.x1-lb/2,g.y1,lb,g.L,'beam');o+=txt(g.x1-lb/2-fs*0.75,g.y1+g.L/2,lab,fs*0.95,'tl','middle',-90);}
  });
  R.cols.forEach(function(c,ci){
    var gr=R.footOf[ci],f0=P.floors[0],ca=f0.ca/100,cb=f0.cb/100;
    o+=rect(c.x-ca/2,c.y-cb/2,ca,cb,'colm');
    if(gr){var B=gr.res.geo.B;o+=txt(c.x,c.y+B/2-fs*0.8,gr.id,fs*0.9,'tl strong');}
  });
  R.xs.forEach(function(x,i2){o+=bubble(x,-m*0.88,String(i2+1),fs);o+=bubble(x,R.Ly+m*0.88,String(i2+1),fs);});
  R.ys.forEach(function(y,j2){o+=bubble(-m*0.88,y,letter(j2),fs);o+=bubble(R.Lx+m*0.88,y,letter(j2),fs);});
  for(i=0;i<R.nx-1;i++)o+=dimH(R.xs[i],R.xs[i+1],-m*0.38,F(R.xs[i+1]-R.xs[i],2),fs*0.9);
  for(j=0;j<R.ny-1;j++)o+=dimV(R.ys[j],R.ys[j+1],-m*0.38,F(R.ys[j+1]-R.ys[j],2),fs*0.9);
  o+=dimH(0,R.Lx,R.Ly+m*0.38,F(R.Lx,2),fs*0.9);
  o+=dimV(0,R.Ly,R.Lx+m*0.45,F(R.Ly,2),fs*0.9,true);
  return svg(-m,-m,W,H,o,Math.round(Math.min(760,Math.max(480,W*46))),'Plan des fondations');
}

/* ---------- coupe ---------- */
function coupe(P,R,dir,idx){
  var fl=P.floors,nf=fl.length,pos=dir==='x'?R.xs:R.ys,Lt=pos[pos.length-1],depth=P.depth,top=R.top,ptop=top+P.parapet,o='',k;
  var fs=Math.max(0.16,(Lt+4)/48),line1=R.cols.filter(function(c){return dir==='x'?c.j===idx:c.i===idx;});
  var cpos=line1.map(function(c){return dir==='x'?c.i:c.j;}),cmap={};
  line1.forEach(function(c,q){cmap[cpos[q]]=c;});
  function Y(z){return -z;}
  o+=rect(-0.9,0,Lt+1.8,depth+0.35,'soil');
  o+=rect(0,0,Lt,0.1,'cut');
  var fz=[];
  line1.forEach(function(c,q){
    var ci=R.cols.indexOf(c),gr=R.footOf[ci];
    if(!gr)return;
    var geo=gr.res.geo,w=dir==='x'?geo.A:geo.B,x=pos[cpos[q]];
    fz[q]=-depth+geo.h;
    o+=rect(x-(w+0.1)/2,depth,w+0.1,0.05,'cut');
    o+=rect(x-w/2,depth-geo.h,w,geo.h,'cut');
  });
  if(P.longOn!==false){
    for(var s2=0;s2<cpos.length-1;s2++){
      var ia=R.cols.indexOf(line1[s2]),ib=R.cols.indexOf(line1[s2+1]),ga=R.footOf[ia],gb=R.footOf[ib];
      if(cpos[s2+1]!==cpos[s2]+1||!ga||!gb)continue;
      var wa=dir==='x'?ga.res.geo.A:ga.res.geo.B,wb=dir==='x'?gb.res.geo.A:gb.res.geo.B,lh=P.longH/100;
      var xa2=pos[cpos[s2]]+wa/2,xb2=pos[cpos[s2+1]]-wb/2;
      o+=rect(xa2,depth-ga.res.geo.h,xb2-xa2,lh,'cut');
    }
  }
  o+=line(-0.9,0,Lt+0.9,0,'gl');
  for(k=0;k<nf;k++){
    var z1=R.z[k],z0=k===0?0:R.z[k-1],e=fl[k].e/100,bh=R.sec[k].bh/100;
    line1.forEach(function(c,q){
      var w=(dir==='x'?fl[k].ca:fl[k].cb)/100,x=pos[cpos[q]],zb=k===0?(fz[q]!==undefined?fz[q]:-depth+0.4):z0;
      o+=rect(x-w/2,Y(z1),w,z1-zb,'cut');
    });
    o+=rect(0,Y(z1),Lt,e,'cut');
    for(var q2=0;q2<cpos.length-1;q2++){
      if(cpos[q2+1]!==cpos[q2]+1)continue;
      var w1=(dir==='x'?fl[k].ca:fl[k].cb)/100;
      o+=rect(pos[cpos[q2]]+w1/2,Y(z1)+e,pos[cpos[q2+1]]-pos[cpos[q2]]-w1,bh-e,'cut');
    }
  }
  o+=rect(-0.1,Y(ptop),0.2,P.parapet,'cut')+rect(Lt-0.1,Y(ptop),0.2,P.parapet,'cut');
  var rx=Lt+0.7;
  o+=line(-0.9,0,rx+0.3,0,'lvl');
  o+=txt(rx+0.35,0,'±0,00',fs,'tl','start');
  for(k=0;k<nf;k++){
    o+=line(-0.5,Y(R.z[k]),rx+0.3,Y(R.z[k]),'lvl');
    o+=txt(rx+0.35,Y(R.z[k])-fs*0.7,'+'+F(R.z[k],2),fs,'tl strong','start');
    o+=txt(rx+0.35,Y(R.z[k])+fs*0.7,fl[k].name,fs*0.85,'dimt','start');
  }
  o+=line(-0.9,depth,rx+0.3,depth,'lvl');
  o+=txt(rx+0.35,depth,'−'+F(depth,2),fs,'tl','start');
  for(k=0;k<nf;k++)o+=dimV(Y(R.z[k]),Y(k===0?0:R.z[k-1]),-0.75,F(fl[k].h,2),fs*0.9);
  o+=dimV(0,depth,-0.75,F(depth,2),fs*0.9);
  for(var s=0;s<pos.length-1;s++)o+=dimH(pos[s],pos[s+1],depth+0.75,F(pos[s+1]-pos[s],2),fs*0.9);
  o+=dimH(0,Lt,depth+1.3,F(Lt,2),fs*0.9);
  pos.forEach(function(p,s){o+=bubble(p,depth+1.95,dir==='x'?String(s+1):letter(s),fs);});
  var x0=-1.9,y0=-(ptop+0.6),w=Lt+1.9+3.2,h=ptop+0.6+depth+2.8;
  return svg(x0,y0,w,h,o,Math.round(Math.min(760,Math.max(480,w*38))),'Coupe');
}

/* ---------- façade ---------- */
function facade(P,R,fc){
  var fl=P.floors,nf=fl.length,len=(fc==='N'||fc==='S')?R.Lx:R.Ly,top=R.top,ptop=top+P.parapet,o='',k;
  var fs=Math.max(0.16,(len+3)/48);
  function T(c){return fc==='N'?c.x:fc==='S'?R.Lx-c.x:fc==='E'?R.Ly-c.y:c.y;}
  var onLine=R.fac[fc].onLine;
  o+=rect(0,-top,len,top,'wall');
  o+=rect(0,-ptop,len,P.parapet,'wall2');
  for(k=0;k<nf;k++)o+=rect(0,-R.z[k],len,fl[k].e/100,'cut');
  onLine.forEach(function(c){
    var w=((fc==='N'||fc==='S')?fl[0].ca:fl[0].cb)/100,t=T(c);
    o+=rect(t-w/2,-top,w,top,'colf');
  });
  var cnt=0;
  P.openings.forEach(function(op){
    if(op.f!==fc||op.k>=nf)return;
    var z0=op.k===0?0:R.z[op.k-1],zs=z0+(op.kind==='porte'?0:op.sill),zt=zs+op.h,zl=R.z[op.k]-fl[op.k].e/100;
    var bad=op.x<0||op.x+op.w>len+1e-6||zt>zl+1e-6;
    cnt++;
    if(P.lintelOn!==false)o+=rect(op.x-0.2,-(zt+0.2),op.w+0.4,0.2,'cut');
    o+=rect(op.x,-zt,op.w,op.h,(bad?'bad ':'')+(op.kind==='porte'?'door':'fen'));
    if(op.kind==='fen'){
      o+=line(op.x+op.w/2,-zt,op.x+op.w/2,-zs,'ln2');
      o+=line(op.x,-(zs+op.h/2),op.x+op.w,-(zs+op.h/2),'ln2');
    }else{
      o+=line(op.x+op.w/2,-zt,op.x+op.w/2,-zs,'ln2');
      o+=circ(op.x+op.w*0.42,-(zs+op.h*0.48),Math.max(0.02,fs*0.12),'knob');
    }
    if(op.w>=0.8)o+=txt(op.x+op.w/2,-(zs+op.h)-fs*0.7,F(op.w,2)+' × '+F(op.h,2),fs*0.78,'tl');
  });
  o+=line(-0.8,0,len+0.8,0,'gl');
  o+=rect(-0.8,0,len+1.6,0.3,'soil');
  var rx=len+0.5;
  for(k=0;k<nf;k++){
    o+=line(-0.5,-R.z[k],rx,-R.z[k],'lvl');
    o+=txt(rx+0.05,-R.z[k]-fs*0.7,'+'+F(R.z[k],2),fs*0.9,'tl strong','start');
  }
  o+=txt(rx+0.05,-ptop-fs*0.2,'+'+F(ptop,2),fs*0.9,'dimt','start');
  o+=txt(rx+0.05,-fs*0.7,'±0,00',fs*0.9,'tl','start');
  for(k=0;k<nf;k++)o+=dimV(-R.z[k],-(k===0?0:R.z[k-1]),-0.75,F(fl[k].h,2),fs*0.9);
  o+=dimV(-ptop,-top,-0.75,F(P.parapet,2),fs*0.9);
  var aN=(fc==='N'||fc==='S')?R.nx:R.ny;
  for(var q=0;q<aN;q++){
    var t=fc==='N'?R.xs[q]:fc==='S'?R.Lx-R.xs[q]:fc==='E'?R.Ly-R.ys[q]:R.ys[q];
    var lab=(fc==='N'||fc==='S')?String(q+1):letter(q);
    o+=bubble(t,0.85,lab,fs);
  }
  o+=dimH(0,len,1.55,F(len,2),fs*0.9);
  return svg(-1.7,-(ptop+0.6),len+3.5,ptop+0.6+2.3,o,Math.round(Math.min(760,Math.max(480,(len+3.5)*38))),'Façade '+fc);
}

/* ---------- sections d'armatures (unités en cm) ---------- */
function secBeam(d){
  var b=d.b,h=d.h,c=3,pt=d.phit/10,fs=Math.max(b,h)/8.5,o='',W=b+22,H=h+24;
  o+=rect(0,0,b,h,'conc');
  o+=rect(c,c,b-2*c,h-2*c,'stir','rx="1.6"');
  var rb=Math.max(d.phi/20,1),rt=Math.max(d.tphi/20,1),xa=c+pt+rb,yb=h-c-pt-rb,xt=c+pt+rt,yt=c+pt+rt;
  spread(d.n,xa,b-xa).forEach(function(x){o+=circ(x,yb,rb,'bar');});
  spread(d.tn,xt,b-xt).forEach(function(x){o+=circ(x,yt,rt,'bar');});
  o+=txt(b/2,h+fs*1.1,d.n+'HA'+d.phi,fs,'tl strong');
  o+=txt(b/2,-fs*0.9,String(b),fs,'dimt');
  o+=txt(b+fs*0.9,h/2,String(h),fs,'dimt','middle',-90);
  return svg(-6,-fs*1.7,W,H+fs*0.6,o,0,'Section de poutre '+b+' sur '+h,false);
}
function secColumn(d){
  var b=d.b,h=d.h,c=3,pt=d.phit/10,r=Math.max(d.phi/20,1),fs=Math.max(b,h)/8,o='',W=b+22,H=h+24;
  o+=rect(0,0,b,h,'conc');
  o+=rect(c,c,b-2*c,h-2*c,'stir','rx="1.6"');
  var x0=c+pt+r,x1=b-x0,y0=x0,y1=h-x0,rem=Math.max(0,d.n-4),ka=Math.max(0,Math.min(rem/2,Math.round(rem/2*(b/(b+h))))),kb=rem/2-ka,pts=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],t;
  for(t=1;t<=ka;t++){var px=x0+(x1-x0)*t/(ka+1);pts.push([px,y0],[px,y1]);}
  for(t=1;t<=kb;t++){var py=y0+(y1-y0)*t/(kb+1);pts.push([x0,py],[x1,py]);}
  pts.forEach(function(p){o+=circ(p[0],p[1],r,'bar');});
  o+=txt(b/2,h+fs*1.1,d.n+'HA'+d.phi,fs,'tl strong');
  o+=txt(b/2,-fs*0.9,String(b),fs,'dimt');
  o+=txt(b+fs*0.9,h/2,String(h),fs,'dimt','middle',-90);
  return svg(-6,-fs*1.7,W,H+fs*0.6,o,0,'Section de poteau '+b+' sur '+h,false);
}
function footing(d){
  var A=d.A,B=d.B,fs=Math.max(A,B)/11,o='',m=Math.max(A,B)*0.18;
  o+=rect(0,0,A,B,'conc');
  var ys=spread(d.na,0.05,B-0.05),xs=spread(d.nb,0.05,A-0.05);
  ys.forEach(function(y){o+=line(0.05,y,A-0.05,y,'barl');});
  xs.forEach(function(x){o+=line(x,0.05,x,B-0.05,'barl2');});
  var ca=d.a/100,cb=d.b/100;
  o+=rect(A/2-ca/2,B/2-cb/2,ca,cb,'colm');
  o+=txt(A/2,-fs*0.9,'A = '+F(A,2)+' m',fs,'tl strong');
  o+=txt(A+fs*0.9,B/2,'B = '+F(B,2)+' m',fs,'tl strong','middle',-90);
  o+=txt(A/2,B+fs*1.0,'// A : '+d.na+'HA'+d.pa+'   // B : '+d.nb+'HA'+d.pb,fs*0.9,'dimt');
  return svg(-m*0.3,-fs*1.8,A+m*1.4,B+fs*3.2,o,0,'Plan de semelle',false);
}
function slabPlan(d){
  var lx=d.lx,ly=d.ly,fs=Math.max(lx,ly)/14,o='',m=Math.max(lx,ly)*0.12;
  o+=rect(0,0,lx,ly,'conc');
  var k1=Math.max(3,Math.min(9,Math.round(ly/(d.bx.s/100)))),k2=Math.max(3,Math.min(9,Math.round(lx/(d.by.s/100))));
  spread(k1,ly*0.08,ly*0.92).forEach(function(y){o+=line(lx*0.04,y,lx*0.96,y,'barl');});
  spread(k2,lx*0.08,lx*0.92).forEach(function(x){o+=line(x,ly*0.04,x,ly*0.96,'barl2');});
  o+=txt(lx/2,-fs*0.9,'lx = '+F(lx,2)+' m',fs,'tl strong');
  o+=txt(lx+fs*0.9,ly/2,'ly = '+F(ly,2)+' m',fs,'tl strong','middle',-90);
  o+=txt(lx/2,ly+fs*1.0,'sens lx : HA'+d.bx.phi+' e='+d.bx.s+'   sens ly : HA'+d.by.phi+' e='+d.by.s,fs*0.82,'dimt');
  return svg(-m*0.3,-fs*1.8,lx+m*1.4,ly+fs*3.2,o,0,'Plan de dalle',false);
}
function drawFor(d){
  if(!d)return '';
  if(d.type==='poutre')return secBeam(d);
  if(d.type==='poteau')return secColumn(d);
  if(d.type==='semelle')return footing(d);
  if(d.type==='dalle')return slabPlan(d);
  return '';
}
return {coffrage:coffrage,fondations:fondations,coupe:coupe,facade:facade,drawFor:drawFor,letter:letter,esc:esc};
})();

(function(){

/* ---------- views ---------- */
function gridInfo(){
  var sx=0,sy=0;P.axesX.forEach(function(v){sx+=v;});P.axesY.forEach(function(v){sy+=v;});
  return plural(P.axesX.length,'travée')+' en X × '+plural(P.axesY.length,'travée')+' en Y · emprise '+F(sx,2)+' × '+F(sy,2)+' m · '+F(sx*sy,1)+' m² au sol';
}
function axf(dir,label){
  var a=P['axes'+dir].map(function(v){return F(v,2);}).join(' ');
  return '<div class="fld w2"><label for="ax-'+dir+'">'+label+'</label><input id="ax-'+dir+'" type="text" inputmode="decimal" data-axes="'+dir+'" value="'+esc(a)+'"></div>';
}
function projet(){
  var h='<section class="card"><h2>Projet</h2><div class="fields">'+
    fld('Nom du projet','name',P.name,{text:1,cls:'w2'})+
    sel('Béton fc28','fc',P.fc,[[20,'20 MPa'],[25,'25 MPa'],[30,'30 MPa']])+
    sel('Acier','fe',P.fe,[[400,'HA 400'],[500,'HA 500']])+
    fld('Sol admissible (bar)','sol',P.sol,{step:'0.1'})+
    fld('Fondations : profondeur (m)','depth',P.depth,{step:'0.1'})+'</div></section>';
  h+='<section class="card"><h2>Trame</h2><p class="note">Entre les distances entre axes, séparées par un espace. Exemple : 4,00 4,00 3,50</p><div class="fields">'+
    axf('X','Travées dans le sens X (m)')+axf('Y','Travées dans le sens Y (m)')+'</div><p class="note strong" id="gridInfo">'+gridInfo()+'</p></section>';
  h+='<section class="card"><h2>Niveaux</h2><p class="note">Chaque niveau comprend ses poteaux et le plancher haut. Le dernier plancher est la terrasse.</p>';
  P.floors.forEach(function(f,k){
    var p='floors.'+k+'.';
    h+='<div class="lvl"><div class="lvl-h">'+fld('Nom',p+'name',f.name,{text:1,cls:'grow'})+
      (P.floors.length>1?'<button class="btn danger" data-act="delfloor" data-v="'+k+'">Supprimer</button>':'')+'</div><div class="fields">'+
      fld('Hauteur (m)',p+'h',f.h,{step:'0.05'})+fld('Dalle e (cm)',p+'e',f.e,{step:'1'})+
      fld('G rev. + cloisons (kN/m²)',p+'g',f.g,{step:'0.1'})+fld('Q surcharge (kN/m²)',p+'q',f.q,{step:'0.5'})+
      fld('Poteau a (cm)',p+'ca',f.ca,{step:'5'})+fld('Poteau b (cm)',p+'cb',f.cb,{step:'5'})+
      (P.beamAuto?'':fld('Poutre b (cm)',p+'bb',f.bb,{step:'5'})+fld('Poutre h (cm)',p+'bh',f.bh,{step:'5'}))+'</div></div>';
  });
  h+='<div class="btns"><button class="btn" data-act="addfloor">Ajouter un niveau</button></div></section>';
  h+='<section class="card"><h2>Longrines, chaînages et linteaux</h2><div class="fields">'+
    fld('Longrine b (cm)','longB',P.longB,{step:'5'})+fld('Longrine h (cm)','longH',P.longH,{step:'5'})+
    fld('Épaisseur des murs (cm)','wallT',P.wallT,{step:'5'})+fld('Hauteur du chaînage (cm)','chH',P.chH,{step:'5'})+'</div>'+
    '<div class="btns">'+chk('Longrines entre les semelles','longOn',P.longOn!==false,false)+chk('Chaînages horizontaux et verticaux','chainOn',P.chainOn!==false,false)+chk('Linteaux au-dessus des ouvertures','lintelOn',P.lintelOn!==false,false)+'</div></section>';
  h+='<section class="card"><h2>Hypothèses de calcul</h2><div class="fields">'+
    sel('Longueur de flambement','kflamb',P.kflamb,[[0.7,'lf = 0,7·l0'],[1,'lf = 1,0·l0']])+
    fld('Mur extérieur (kN/m²)','wallG',P.wallG,{step:'0.1'})+fld('Part pleine du mur','openF',P.openF,{step:'0.05'})+
    fld('Cloison sur poutre (kN/m)','partG',P.partG,{step:'0.5'})+fld('Acrotère (m)','parapet',P.parapet,{step:'0.1'})+
    fld('Chutes d\'acier (%)','loss',P.loss,{step:'1'})+'</div>'+
    '<div class="btns">'+chk('Dimensionner les poutres automatiquement (h ≈ L/12)','beamAuto',P.beamAuto,true)+'</div></section>';
  h+='<section class="card"><h2>Données</h2><p class="note">Le projet est enregistré dans ce navigateur.</p><div class="btns">'+
    '<button class="btn" data-act="reset" data-v="example">'+(ui.confirm==='example'?'Confirmer : remplacer par l\'exemple':'Recharger l\'exemple')+'</button>'+
    '<button class="btn" data-act="reset" data-v="empty">'+(ui.confirm==='empty'?'Confirmer : projet vide':'Nouveau projet vide')+'</button></div></section>';
  return h;
}

function structure(){
  var nx=P.axesX.length+1,ny=P.axesY.length+1,i,j,h;
  h='<section class="card"><h2>Poteaux</h2><p class="note">Touche un nœud de la trame pour poser ou retirer un poteau.</p><div class="nodes" style="grid-template-columns:auto repeat('+nx+',minmax(0,1fr))"><span></span>';
  for(i=0;i<nx;i++)h+='<span class="nl">'+(i+1)+'</span>';
  for(j=0;j<ny;j++){
    h+='<span class="nl">'+DR.letter(j)+'</span>';
    for(i=0;i<nx;i++){
      var on=!P.colOff[i+','+j];
      h+='<button class="node" data-act="node" data-v="'+i+','+j+'" aria-pressed="'+on+'" aria-label="Poteau '+DR.letter(j)+(i+1)+'">'+(on?'■':'')+'</button>';
    }
  }
  h+='</div></section>';
  if(R.err)return h+errCard();
  var nb=R.bg.length,np=R.pg.length;
  h+='<section class="card"><h2>Ouvrage</h2><div class="stats">'+
    '<div><b>'+R.cols.length+'</b><span>poteaux</span></div><div><b>'+nb+'</b><span>poutres par niveau</span></div>'+
    '<div><b>'+np+'</b><span>dalles par niveau</span></div><div><b>'+F(R.top,2)+' m</b><span>hauteur hors sol</span></div></div>'+
    '<div class="tw"><table class="tbl"><thead><tr><th>Niveau</th><th>Cote plancher</th><th>Poteau</th><th>Poutre</th><th>Dalle</th></tr></thead><tbody>'+
    P.floors.map(function(f,k){return '<tr><td>'+esc(f.name)+'</td><td>+'+F(R.z[k],2)+' m</td><td>'+f.ca+'×'+f.cb+'</td><td>'+R.sec[k].bb+'×'+R.sec[k].bh+'</td><td>e = '+f.e+' cm</td></tr>';}).join('')+
    '</tbody></table></div></section>';
  h+='<section class="card"><h2>Alertes</h2>'+(R.warns.length?'<ul class="alerts">'+R.warns.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>':'<p class="ok">Aucune alerte sur les éléments calculés.</p>')+
    '<p class="note">Plancher en dalle pleine. Un plancher à corps creux demande un calcul des poutrelles, non fait ici.</p></section>';
  return h;
}

function legendTables(k){
  var fl=P.floors[k],h='<div class="legend">';
  h+='<div><h3>Poteaux</h3><p>'+R.cols.length+' poteaux '+fl.ca+'×'+fl.cb+' cm</p></div>';
  h+='<div><h3>Poutres</h3>'+R.bList.filter(function(g){return g.k===k;}).map(function(g){return '<p><b>'+g.id+'</b> '+g.b+'×'+g.h+' · L '+F(g.L,2)+' m · ×'+g.n+'</p>';}).join('')+'</div>';
  h+='<div><h3>Dalles</h3>'+R.dList.filter(function(g){return g.k===k;}).map(function(g){return '<p><b>'+g.id+'</b> '+F(g.dx,2)+'×'+F(g.dy,2)+' m · e '+g.e+' cm · ×'+g.n+'</p>';}).join('')+'</div></div>';
  return h;
}
function legendFond(){
  return '<div class="legend"><div><h3>Longrines</h3>'+(R.lgList.length?R.lgList.map(function(g){return '<p><b>'+g.id+'</b> '+g.b+'×'+g.h+' · L '+F(g.L,2)+' m · ×'+g.n+'</p>';}).join(''):'<p>Aucune</p>')+'</div>'+
    '<div><h3>Semelles</h3>'+R.sList.map(function(g){var geo=g.res.geo;return '<p><b>'+g.id+'</b> '+F(geo.A,2)+'×'+F(geo.B,2)+' m · h '+F(geo.h*100,0)+' cm · ×'+g.items.length+'</p>';}).join('')+'</div></div>';
}
function coffrage(){
  if(R.err)return errCard();
  if(ui.floor>=P.floors.length||ui.floor<-1)ui.floor=0;
  var k=ui.floor,items=[[-1,'Fondations']].concat(P.floors.map(function(f,q){return [q,f.name+' (plancher haut)'];}));
  return '<section class="card"><h2>'+(k<0?'Plan des fondations':'Plan de coffrage')+'</h2>'+chips('floor',items,k)+
    '<div id="drawing">'+scrollBox(k<0?DR.fondations(P,R):DR.coffrage(P,R,k))+'</div>'+
    '<div class="btns"><button class="btn" data-act="svg" data-v="'+(k<0?'fondations':'coffrage-'+k)+'">Exporter en SVG</button></div>'+(k<0?legendFond():legendTables(k))+'</section>';
}

function elCard(title,sub,res,extra){
  if(res.err)return '<article class="card el"><h3>'+title+'</h3><p class="warn">'+esc(res.err)+'</p></article>';
  var rows=res.rows.map(function(r){return '<tr'+(r[2]?' class="hl"':'')+'><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';}).join('');
  var warns=res.warns.filter(function(w){return w.indexOf('béton de propreté')<0;});
  var opt=res.options.filter(function(o){return o.list.length;}).map(function(o){return '<p class="note">'+esc(o.label)+' : '+o.list.map(esc).join(' · ')+'</p>';}).join('');
  var steel=res.steel&&res.steel.length?'<div class="tw"><table class="tbl mini"><thead><tr><th>Aciers</th><th>HA</th><th>Longueur</th></tr></thead><tbody>'+
    res.steel.map(function(s){return '<tr><td>'+esc(s.part)+'</td><td>'+s.phi+'</td><td>'+F(s.len,1)+' m</td></tr>';}).join('')+
    '</tbody></table></div>':'';
  return '<article class="card el"><h3>'+title+'</h3><p class="sub">'+sub+'</p><div class="el-b"><div class="fig">'+DR.drawFor(res.draw)+'</div><table class="kv"><tbody>'+rows+'</tbody></table></div>'+
    (warns.length?'<ul class="alerts">'+warns.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>':'')+opt+steel+(extra||'')+'</article>';
}
function labelsOf(arr,max){return arr.length>max?arr.slice(0,max).join(', ')+' +'+(arr.length-max):arr.join(', ');}
function ferrPoteaux(){
  return R.cList.map(function(g){
    var labs=g.items.map(function(it){return R.cols[it.ci].id;});
    return elCard('Poteaux '+g.a+'×'+g.b+' · '+esc(P.floors[g.k].name),labelsOf(labs,8)+' · Nu max '+F(g.rep.Nu,0)+' kN ('+R.cols[g.rep.ci].id+') · l0 = '+F(g.rep.l0,2)+' m',g.rep.res);
  }).join('')||'<p class="note">Aucun poteau calculé.</p>';
}
function ferrPoutres(){
  return R.bList.map(function(g){
    return elCard(g.id+' · '+g.b+'×'+g.h+' · '+esc(P.floors[g.k].name),plural(g.n,'poutre')+' · L = '+F(g.L,2)+' m · G = '+F(g.G,1)+' kN/m, Q = '+F(g.Q,1)+' kN/m'+(g.cont?' · continue':' · isostatique'),g.res);
  }).join('')||'<p class="note">Aucune poutre.</p>';
}
function ferrDalles(){
  return R.dList.map(function(g){
    return elCard(g.id+' · '+esc(P.floors[g.k].name),plural(g.n,'panneau')+' de '+F(g.dx,2)+' × '+F(g.dy,2)+' m',g.res);
  }).join('')||'<p class="note">Aucune dalle.</p>';
}
function ferrSemelles(){
  return R.sList.map(function(g){
    var labs=g.items.map(function(ci){return R.cols[ci].id;});
    return elCard(g.id,plural(g.items.length,'semelle')+' sous '+labelsOf(labs,8)+' · Nser max '+F(g.Nser,0)+' kN',g.res);
  }).join('')||'<p class="note">Aucune semelle.</p>';
}
function ferrLongrines(){
  if(!R.lgList.length)return '<p class="note">Aucune longrine (option désactivée dans Projet).</p>';
  return R.lgList.map(function(g){
    return elCard(g.id+' · longrine '+g.b+'×'+g.h,plural(g.n,'longrine')+' · L = '+F(g.L,2)+' m · '+(g.per?'de rive':'intérieure')+' · Nu max des poteaux '+F(g.Nu,0)+' kN',g.res);
  }).join('');
}
function ferrChainages(){
  var h='';
  R.chList.forEach(function(c){h+=elCard(c.id+' · '+c.label,'×'+c.n+' · L = '+F(c.L,2)+' m',c.res);});
  R.lnList.forEach(function(g){h+=elCard(g.id+' · linteau '+g.b+'×'+g.h,plural(g.n,'linteau')+' · ouverture de '+F(g.w,2)+' m · portée de calcul '+F(g.L,2)+' m',g.res);});
  return h||'<p class="note">Aucun chaînage ni linteau (options désactivées ou aucune ouverture).</p>';
}
function ferrAciers(){
  var q=R.q,types=['Poteaux','Poutres','Dalles','Semelles','Longrines','Chaînages','Linteaux'],rows='';
  types.forEach(function(t){
    Object.keys(q.steelAgg[t]).sort(function(a,b){return a-b;}).forEach(function(phi,ix){
      var len=q.steelAgg[t][phi];
      rows+='<tr><td>'+(ix===0?t:'')+'</td><td>HA'+phi+'</td><td class="r">'+F(len,0)+' m</td><td class="r">'+F(0.00617*phi*phi*len,0)+' kg</td></tr>';
    });
  });
  var tot=Object.keys(q.byPhi).sort(function(a,b){return a-b;}).map(function(phi){
    return '<tr><td>HA'+phi+'</td><td class="r">'+F(q.byPhi[phi].len,0)+' m</td><td class="r">'+F(q.byPhi[phi].kg,0)+' kg</td><td class="r">'+F(q.byPhi[phi].len/12,0)+' barres de 12 m</td></tr>';
  }).join('');
  return '<section class="card"><h2>Nomenclature des aciers</h2><div class="tw"><table class="tbl"><thead><tr><th>Élément</th><th>Diamètre</th><th class="r">Longueur</th><th class="r">Poids</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
    '<section class="card"><h2>Total par diamètre</h2><div class="tw"><table class="tbl"><thead><tr><th>Diamètre</th><th class="r">Longueur</th><th class="r">Poids</th><th class="r">Commande</th></tr></thead><tbody>'+tot+
    '<tr class="tot"><td>Total</td><td></td><td class="r">'+F(q.kg,0)+' kg</td><td></td></tr>'+
    '<tr class="tot"><td>Avec chutes ('+P.loss+' %)</td><td></td><td class="r">'+F(q.kgLoss,0)+' kg</td><td></td></tr></tbody></table></div>'+
    '<p class="note">Ratio : '+F(q.ratio,0)+' kg d\'acier par m³ de béton. Longueurs avec crochets et recouvrements forfaitaires, sans épure de coupe.</p></section>';
}
function ferraillage(){
  if(R.err)return errCard();
  var tabs=[['poteaux','Poteaux'],['poutres','Poutres'],['dalles','Dalles'],['semelles','Semelles'],['longrines','Longrines'],['chainages','Chaînages'],['aciers','Aciers']];
  var body={poteaux:ferrPoteaux,poutres:ferrPoutres,dalles:ferrDalles,semelles:ferrSemelles,longrines:ferrLongrines,chainages:ferrChainages,aciers:ferrAciers}[ui.ferr]();
  return '<section class="card flat"><h2>Plan du ferrailleur</h2>'+chips('ferr',tabs,ui.ferr)+
    '<p class="note">Calcul à l\'ELU, BAEL 91 révisé 99, fissuration peu préjudiciable. Les barres proposées sont à vérifier par un ingénieur.</p></section>'+body;
}

function coupes(){
  if(R.err)return errCard();
  var dir=ui.cdir,cnt=dir==='x'?R.ny:R.nx;
  if(ui.cidx>=cnt)ui.cidx=0;
  var items=[];for(var q=0;q<cnt;q++)items.push([q,dir==='x'?'Axe '+DR.letter(q):'Axe '+(q+1)]);
  var onLine=R.cols.filter(function(c){return dir==='x'?c.j===ui.cidx:c.i===ui.cidx;}).length;
  return '<section class="card"><h2>Coupes</h2>'+chips('cdir',[['x','Coupe en long (sens X)'],['y','Coupe en travers (sens Y)']],dir)+chips('cidx',items,ui.cidx)+
    (onLine<2?'<p class="note warn">Cet axe porte moins de 2 poteaux : la coupe est incomplète.</p>':'')+
    '<div id="drawing">'+scrollBox(DR.coupe(P,R,dir,ui.cidx))+'</div>'+
    '<div class="btns"><button class="btn" data-act="svg" data-v="coupe-'+dir+'-'+ui.cidx+'">Exporter en SVG</button></div>'+
    '<p class="note">Coupe schématique : poteaux, poutres, planchers, semelles et acrotère aux dimensions calculées.</p></section>';
}

function facOut(){
  var f=R.fac[ui.fac],net=f.maconn;
  return '<div id="facOut">'+scrollBox(DR.facade(P,R,ui.fac))+
    '<div class="stats"><div><b>'+F(f.len,2)+' m</b><span>longueur</span></div><div><b>'+F(f.maconn,1)+' m²</b><span>maçonnerie nette</span></div>'+
    '<div><b>'+F(f.enduit,1)+' m²</b><span>enduit extérieur</span></div><div><b>'+F(f.fen+f.porte,1)+' m²</b><span>ouvertures</span></div></div></div>';
}
function facades(){
  if(R.err)return errCard();
  var f=ui.fac,h='<section class="card"><h2>Façades</h2>'+chips('fac',MD.FACS.map(function(x){return [x,MD.FACNAME[x]];}),f)+
    '<p class="note">Vue de l\'extérieur. Position x mesurée depuis le bord gauche de la façade.</p><div id="drawing"></div>'+
    '<div class="btns"><button class="btn" data-act="svg" data-v="facade-'+f+'">Exporter en SVG</button></div></section>';
  h+='<section class="card"><h2>Ouvertures · façade '+MD.FACNAME[f]+'</h2>';
  var any=false;
  P.openings.forEach(function(o,ix){
    if(o.f!==f)return;any=true;var p='openings.'+ix+'.';
    h+='<div class="lvl"><div class="fields">'+
      sel('Niveau',p+'k',o.k,P.floors.map(function(fl,q){return [q,fl.name];}))+
      sel('Type',p+'kind',o.kind,[['fen','Fenêtre'],['porte','Porte']],{str:1})+
      fld('x (m)',p+'x',o.x,{step:'0.1'})+fld('Largeur (m)',p+'w',o.w,{step:'0.1'})+fld('Hauteur (m)',p+'h',o.h,{step:'0.1'})+
      (o.kind==='fen'?fld('Allège (m)',p+'sill',o.sill,{step:'0.1'}):'')+'</div>'+
      '<div class="btns"><button class="btn danger" data-act="delop" data-v="'+o.id+'">Supprimer</button></div></div>';
  });
  if(!any)h+='<p class="note">Aucune ouverture sur cette façade.</p>';
  h+='<div class="btns"><button class="btn" data-act="addop">Ajouter une ouverture</button></div></section>';
  return h;
}

function metreRows(){
  var q=R.q,ft=R.facTot;
  return [
    {sec:'Terrassement et fondations'},
    {k:'fouille',lab:'Fouilles en puits',u:'m³',q:q.fouille},
    {k:'propre',lab:'Béton de propreté',u:'m³',q:q.propre},
    {sec:'Ossature en béton armé'},
    {k:'beton',lab:'Béton armé (semelles, poteaux, poutres, dalles)',u:'m³',q:q.volTot},
    {k:'acier',lab:'Acier HA, chutes de '+P.loss+' % comprises',u:'kg',q:q.kgLoss},
    {k:'coffrage',lab:'Coffrage',u:'m²',q:q.cofTot},
    {sec:'Façades'},
    {k:'maconn',lab:'Maçonnerie des murs extérieurs',u:'m²',q:ft.maconn},
    {k:'enduit',lab:'Enduit extérieur',u:'m²',q:ft.enduit},
    {k:'fen',lab:'Fenêtres',u:'m²',q:ft.fen},
    {k:'porte',lab:'Portes',u:'m²',q:ft.porte}
  ];
}
function metreTotals(){
  var rows=metreRows(),ht=0;
  rows.forEach(function(r){if(r.k){r.pu=P.prices[r.k]||0;r.tot=r.q*r.pu;ht+=r.tot;}});
  var tva=P.tva?ht*0.2:0;
  return {rows:rows,ht:ht,tva:tva,ttc:ht+tva};
}
function mad(v){return F(v,0)+' MAD';}
function metre(){
  if(R.err)return errCard();
  var T=metreTotals(),q=R.q,h='<section class="card"><h2>Métré et devis estimatif</h2><div class="tw"><table class="tbl"><thead><tr><th>Désignation</th><th class="r">Qté</th><th>Unité</th><th class="r">PU (MAD)</th><th class="r">Montant</th></tr></thead><tbody>';
  T.rows.forEach(function(r){
    if(r.sec){h+='<tr class="sec"><td colspan="5">'+r.sec+'</td></tr>';return;}
    h+='<tr><td>'+r.lab+'</td><td class="r">'+F(r.q,r.q<100?2:0)+'</td><td>'+r.u+'</td><td class="r"><input class="pu" aria-label="Prix unitaire '+esc(r.lab)+'" type="number" inputmode="decimal" data-n="1" data-p="prices.'+r.k+'" value="'+r.pu+'"></td><td class="r" id="tot-'+r.k+'">'+mad(r.tot)+'</td></tr>';
  });
  h+='<tr class="tot"><td colspan="4">Total HT</td><td class="r" id="t-ht">'+mad(T.ht)+'</td></tr>'+
    '<tr><td colspan="4">TVA 20 %</td><td class="r" id="t-tva">'+mad(T.tva)+'</td></tr>'+
    '<tr class="tot"><td colspan="4">Total TTC</td><td class="r" id="t-ttc">'+mad(T.ttc)+'</td></tr></tbody></table></div>'+
    '<div class="btns">'+chk('Ajouter la TVA de 20 %','tva',P.tva,false)+'</div>'+

function loadPdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){
      try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);}
      catch(e){rej(e);}
    };
    s.onerror=function(){rej(new Error('pdfjs'));};
    document.head.appendChild(s);
  });
}
function toBlob(cv,type,q){return new Promise(function(res){cv.toBlob(res,type,q);});}
async function renderPdf(file){
  var lib=await loadPdfjs(),buf=await file.arrayBuffer(),doc=await lib.getDocument({data:buf}).promise,out=[],n=Math.min(doc.numPages,6),i;
  for(i=1;i<=n;i++){
    var pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),sc=Math.min(4,2400/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:sc});
    var cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:vp}).promise;
    var b=await toBlob(cv,'image/jpeg',0.92);
    if(b)out.push({blob:b,label:file.name+(doc.numPages>1?' · page '+i:'')});
  }
  return out;
}
async function tilesOf(blob){
  var out=[];
  try{
    var bmp=await createImageBitmap(blob),w=bmp.width,h=bmp.height;
    if(Math.max(w,h)<1800)return out;
    var tw=Math.round(w*0.54),th=Math.round(h*0.54),xs=[0,w-tw],ys=[0,h-th],r,c;
    for(r=0;r<2;r++)for(c=0;c<2;c++){
      var cv=document.createElement('canvas');cv.width=tw;cv.height=th;
      cv.getContext('2d').drawImage(bmp,xs[c],ys[r],tw,th,0,0,tw,th);
      var b=await toBlob(cv,'image/jpeg',0.92);
      if(b)out.push(b);
    }
  }catch(e){}
  return out.length===4?out:[];
}

function planPrompt(nPages,hasTiles){

  '- Utilise les cotes écrites sur le plan. Sinon utilise l\'échelle indiquée. Sinon estime avec des repères connus (porte 0,90 m) et mets confidence à "faible".\n'+
  '- floors : du plus bas au plus haut, h = hauteur d\'étage de plancher fini à plancher fini, en m. Compte aussi la terrasse accessible seulement si elle a un niveau propre ; une simple terrasse sur le dernier étage n\'est pas un niveau.\n'+
  '- openings : fenêtres et portes extérieures. f = façade parmi N, S, E, O (le Nord est en haut du plan sauf flèche contraire). k = indice du niveau (0 = rez-de-chaussée). x = position du bord gauche de l\'ouverture, en m, depuis le bord gauche de la façade VUE DE L\'EXTÉRIEUR : façade N depuis l\'angle ouest, façade S depuis l\'angle est, façade E depuis l\'angle sud, façade O depuis l\'angle nord. w = largeur, h = hauteur, sill = allège (0 pour une porte). kind = "fen" ou "porte".\n'+
  '- notes : tes hypothèses et tout ce qui est illisible ou à vérifier, en français, phrases courtes.\n'+

function sanitizePlan(raw){
  if(!raw||typeof raw!=='object')return {err:'Claude n\'a pas renvoyé de données exploitables. Essaie avec une image plus nette.'};
  function axes(a){
    var v=(Array.isArray(a)?a:[]).map(Number).filter(function(x){return isFinite(x);}).sort(function(p,q){return p-q;});
    if(!v.length)return [];
    var o=[v[0]],i;for(i=1;i<v.length;i++){if(v[i]-o[o.length-1]>=0.8)o.push(v[i]);}
    return o.map(function(x){return x-o[0];});
  }
  var xs=axes(raw.xs),ys=axes(raw.ys),notes=Array.isArray(raw.notes)?raw.notes.map(String).slice(0,12):[];
  if(xs.length<2||ys.length<2)return {err:'Les axes du plan n\'ont pas pu être lus. Essaie avec une image plus nette, avec les cotes lisibles.'};
  if(xs.length>12||ys.length>12)return {err:'Trop d\'axes détectés. Envoie un seul plan d\'étage à la fois.'};
  function spans(v){return v.slice(1).map(function(x,i){return Math.round((x-v[i])*20)/20;});}
  var sx=spans(xs),sy=spans(ys),colOff={},on={},i,j,cnt=0,cols=Array.isArray(raw.columns)?raw.columns:null;
  if(cols&&cols.length){
    cols.forEach(function(c){
      if(Array.isArray(c)&&c[0]>=0&&c[0]<xs.length&&c[1]>=0&&c[1]<ys.length&&c[0]%1===0&&c[1]%1===0)on[c[0]+','+c[1]]=1;
    });
  }
  var useAll=!Object.keys(on).length||Object.keys(on).length<4;
  for(j=0;j<ys.length;j++)for(i=0;i<xs.length;i++){
    if(useAll||on[i+','+j])cnt++;else colOff[i+','+j]=1;
  }
  if(useAll)notes.push('Les poteaux n\'ont pas pu être placés avec certitude : un poteau a été mis à chaque croisement d\'axes.');
  var fl=(Array.isArray(raw.floors)?raw.floors:[]).slice(0,8).map(function(f,q){
    var h=Number(f&&f.h);if(!isFinite(h)||h<2.2||h>5)h=3;
    return {name:String(f&&f.name||(q===0?'RDC':'Étage '+q)).slice(0,24),h:Math.round(h*20)/20};
  });
  if(!fl.length){fl=[{name:'RDC',h:3}];notes.push('Les niveaux n\'ont pas été trouvés : un seul niveau de 3,00 m a été supposé.');}
  var Lx=xs[xs.length-1],Ly=ys[ys.length-1];
  var ops=(Array.isArray(raw.openings)?raw.openings:[]).filter(function(o){
    return o&&['N','S','E','O'].indexOf(o.f)>=0&&o.k>=0&&o.k<fl.length&&Number(o.w)>0.3&&Number(o.h)>0.3&&isFinite(Number(o.x));
  }).slice(0,80).map(function(o){
    var kind=o.kind==='porte'?'porte':'fen',len=(o.f==='N'||o.f==='S')?Lx:Ly,w=Math.min(Number(o.w),len),x=Math.max(0,Math.min(Number(o.x),len-w));
    return {f:o.f,k:Math.floor(o.k),x:Math.round(x*20)/20,w:Math.round(w*20)/20,h:Math.round(Number(o.h)*20)/20,sill:kind==='porte'?0:Math.max(0,Math.round((Number(o.sill)||0.9)*20)/20),kind:kind};
  });
  return {name:String(raw.name||'Projet du plan').slice(0,60),sx:sx,sy:sy,colOff:colOff,nCols:cnt,floors:fl,openings:ops,conf:String(raw.confidence||'moyenne'),notes:notes};
}
function planErr(e){
  var c=e&&e.code;
  if(c==='no_key')return 'Aucune clé IA : dans Bâtir Sûr, onglet « 📐 Devis depuis plans », étape 2, collez votre clé Gemini ou Claude, puis relancez.';
  if(c==='busy')return 'Les serveurs de l\'IA sont surchargés en ce moment (ce n\'est pas votre clé). Réessayez dans quelques minutes, ou changez de service dans Bâtir Sûr.';
  if(c==='bad_key')return 'La clé IA est refusée : vérifiez-la dans Bâtir Sûr (onglet « 📐 Devis depuis plans », étape 2).';
  if(c==='api')return 'La lecture a échoué : '+(e.message||'erreur inconnue');
  if(c==='not_granted')return 'Claude n\'a pas la permission de lire ce plan. Autorise-le quand la fenêtre apparaît, puis relance.';
  if(c==='rate_limited')return 'Trop de demandes pour le moment. Attends un peu puis relance la lecture.';
  if(c==='session_expired')return 'Ta session a expiré. Reconnecte-toi à Claude puis relance.';
  if(c==='image_rejected')return 'Image refusée (type ou taille). Envoie un JPG ou PNG de moins de 20 Mo.';
  if(c==='invalid_json')return 'Claude n\'a pas pu structurer le plan. Essaie avec une image plus nette, un seul plan d\'étage à la fois.';
  if(c==='images_unavailable'||c==='sampling_disabled'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared')return 'La lecture de plan n\'est pas disponible dans cette vue.';
  if(c==='refused')return 'Claude n\'a pas pu traiter ce document. Essaie un autre plan.';
  return 'La lecture a échoué. Réessaie dans un instant.';
}

var BSAI={
  key:function(p){try{return localStorage.getItem('bs_key_'+p)||'';}catch(e){return '';}},
  conf:function(){
    var a={};try{a=(JSON.parse(localStorage.getItem('bs_plan')||'{}').ai)||{};}catch(e){}
    var prov=a.prov||'gemini';
    if(!BSAI.key(prov))prov=BSAI.key('gemini')?'gemini':BSAI.key('claude')?'claude':prov;
    return {prov:prov,key:BSAI.key(prov),model:((a.prov===prov&&a.model)||(prov==='gemini'?'gemini-3.8-flash':'claude-sonnet-5-5')).trim()};
  },
  b64:function(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=rej;r.readAsDataURL(b);});},
  err:function(code,msg,status){var e=new Error(msg||code);e.code=code;e.status=status;return e;},
  call:async function(c,prompt,imgs,signal){
    var r,j;
    if(c.prov==='gemini'){
      var parts=[{text:prompt}].concat(imgs.map(function(d){return {inline_data:{mime_type:d.t,data:d.b}};}));
      r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.model.replace(/^models\//,''))+':generateContent?key='+encodeURIComponent(c.key),
        {method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})});
      j=await r.json().catch(function(){return {};});
    }else{
      var content=imgs.map(function(d){return {type:'image',source:{type:'base64',media_type:d.t,data:d.b}};});content.push({type:'text',text:prompt});
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:c.model,max_tokens:8000,messages:[{role:'user',content:content}]})});
      j=await r.json().catch(function(){return {};});
    }
    if(!r.ok)throw BSAI.err('http',(j.error&&j.error.message)||('Erreur '+r.status),r.status);
    return c.prov==='gemini'?((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(function(x){return x.text||'';}).join(''):(j.content||[]).filter(function(x){return x.type==='text';}).map(function(x){return x.text;}).join('');
  },
  busy:function(e){return [500,502,503,504,529].indexOf(e.status)>=0||/high demand|overload|unavailable|try again later|temporar/i.test(e.message);},
  alts:async function(c,tried){
    try{var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(c.key)),j=await r.json();
      var v=function(m){return parseFloat((m.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);};
      return (j.models||[]).filter(function(m){return (m.supportedGenerationMethods||[]).indexOf('generateContent')>=0;}).map(function(m){return m.name.replace('models/','');})
        .filter(function(m){return /^gemini/.test(m)&&/flash|pro/.test(m)&&!/image|tts|live|audio|embed|robotics|computer/.test(m)&&tried.indexOf(m)<0;})
        .sort(function(x,y){return ((/lite/.test(x)?1:/pro/.test(x)?2:0)*100-v(x))-((/lite/.test(y)?1:/pro/.test(y)?2:0)*100-v(y));}).slice(0,3);
    }catch(e){return [];}
  }
};
var BSHIM={
  downloads:{save:async function(o){
    var b=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.csv$/.test(o.filename)?'text/csv;charset=utf-8':/\.svg$/.test(o.filename)?'image/svg+xml':'application/octet-stream'});
    var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
  }},
  sample:{
    limits:async function(){return {images:{maxCount:8}};},
    json:async function(prompt,o){
      var c=BSAI.conf();if(!c.key)throw BSAI.err('no_key');
      var imgs=await Promise.all((o.images||[]).map(async function(b){return {t:b.type||'image/jpeg',b:await BSAI.b64(b)};}));
      prompt+='\n\nRéponds UNIQUEMENT avec un objet JSON valide, sans texte autour.';
      var tried=[],waits=[8,20],alts=null,last=null;
      for(var step=0;step<8;step++){
        try{tried.push(c.model);var t=String(await BSAI.call(c,prompt,imgs,o.signal)).replace(/```(json)?/g,''),a=t.indexOf('{'),z=t.lastIndexOf('}');
          if(a<0||z<a)throw BSAI.err('invalid_json');
          try{return JSON.parse(t.slice(a,z+1));}catch(e){throw BSAI.err('invalid_json');}
        }catch(e){
          if(e&&e.name==='AbortError')throw BSAI.err('cancelled');
          if(e.code==='invalid_json')throw e;
          last=e;var sug=String(e.message).match(/use\s+(?:models\/)?([a-z0-9][\w.-]*[a-z0-9])/i);
          if(sug&&/model/i.test(e.message)&&tried.indexOf(sug[1])<0){c.model=sug[1];continue;}
          if(!BSAI.busy(e))break;
          if(waits.length){await new Promise(function(r){setTimeout(r,waits.shift()*1000);});continue;}
          if(c.prov!=='gemini')break;
          if(alts===null)alts=await BSAI.alts(c,tried);
          var nx=alts.shift();if(!nx)break;c.model=nx;waits=[6];
        }
      }
      if(last&&BSAI.busy(last))throw BSAI.err('busy',last.message);
      if(last&&/quota|429|exhausted|rate/i.test(last.message))throw BSAI.err('rate_limited');
      if(last&&/api key|invalid|permission|401|403/i.test(last.message))throw BSAI.err('bad_key',last.message);
      throw BSAI.err('api',last?last.message:'');
    }
  }
};
